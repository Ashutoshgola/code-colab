services:

  mongodb:
    image: mongo:7
    container_name: codecolab-mongodb

    volumes:
      - ./mongodb-data:/data/db

    networks:
      - appbridge

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: always


  backend:
    image: ashutosh78955/codecolab-backend:latest
    container_name: codecolab-backend

    environment:
      PORT: 8000
      MONGODB_URI: "mongodb://mongodb:27017/codecollab"
      FIREBASE_SERVICE_ACCOUNT: "${FIREBASE_SERVICE_ACCOUNT}"

    networks:
      - appbridge

    depends_on:
      mongodb:
        condition: service_healthy

    restart: always


  frontend:
    image: ashutosh78955/codecolab-frontend:latest
    container_name: codecolab-frontend

    networks:
      - appbridge

    restart: always


  nginx:
    build:
      context: ./nginx

    container_name: codecolab-nginx

    ports:
      - "3001:80"

    networks:
      - appbridge

    depends_on:
      - frontend
      - backend

    restart: always


networks:
  appbridge: